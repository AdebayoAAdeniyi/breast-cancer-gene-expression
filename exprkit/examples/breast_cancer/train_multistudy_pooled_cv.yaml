# Tumour versus normal across four studies (pooled_cv).
# leave_one_group_out: train on three studies, test on the fourth, for each study in turn.
data: data/processed/multistudy_tumour_normal
output: results/multistudy_tumour_normal_pooled_cv
seed: 42
task: classification
target: {column: label, positive_class: tumour}
group_column: patient                    # paired tumour/normal samples stay together
genes: {filter: {top_k_variance: 2000}}

model: {type: logistic, grid: {C: [0.001, 0.01, 0.1]}}
evaluation: {type: repeated_cv, n_splits: 5, n_repeats: 5, bootstrap: 1000, permutations: 0}
checks: {batch_column: dataset}
