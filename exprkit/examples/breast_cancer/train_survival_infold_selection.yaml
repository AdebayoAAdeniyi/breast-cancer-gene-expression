# Honest version of gene selection: inside every training fold, keep the 50
# genes most associated with survival (Cox score test) that are not correlated
# above 0.7 with a better gene, then fit elastic net Cox with the clinical factors.
data: data/processed/gse96058
output: results/gse96058_os_infold_selection
seed: 42
task: survival
target: {time: time, event: event}
group_column: patient
one_per_group: true
genes:
  filter: {top_k_variance: 5000}
  select: {n_genes: 50, max_correlation: 0.7}
covariates:
  numeric: [age, tumour_size]
  categorical: [node_status, grade, er, her2]
model:
  type: coxnet
  params: {l1_ratio: 0.5}
  grid: {alpha: [0.01, 0.02, 0.05, 0.1, 0.2]}
evaluation: {type: repeated_cv, n_splits: 5, n_repeats: 5, bootstrap: 1000, permutations: 0}
